{% extends 'debates/base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-10 col-lg-8">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2" style="color: var(--moss);"></i>ตั้งหัวข้อใหม่</h2>
                <p class="text-muted mb-0">สร้างหัวข้อเพื่อมาร่วมโหวตและแสดงมุมมอง</p>
            </div>
        </div>
        
        <div class="card shadow-sm border-0" style="background-color: #fcfcfc;">
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- ส่วนหัวข้อหลัก -->
                    {{ form.as_p }}
                    
                    <hr class="my-4 text-muted">
                    
                    <!-- ส่วนของตัวเลือก (Sides) -->
                    <h5 class="fw-bold mb-3">กำหนดตัวเลือก (ฝั่ง)</h5>
                    <div id="sides-container">
                        {% for side_name in side_names %}
                        <div class="input-group mb-2">
                            <input type="text" name="sides" class="form-control" value="{{ side_name }}" placeholder="ตัวเลือกที่ {{ forloop.counter }}" required>
                            {% if forloop.counter > 2 %}
                            <button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()" aria-label="ลบตัวเลือก">&times;</button>
                            {% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    
                    <!-- ปุ่มเพิ่มตัวเลือก  -->
                    <button type="button" class="btn btn-outline-secondary btn-sm mt-1" onclick="addSide()">
                        <i class="bi bi-plus-circle me-1"></i> เพิ่มตัวเลือก
                    </button>
                    
                    <div class="d-flex gap-2 mt-4 pt-4 border-top">
                        <button type="submit" class="btn btn-orange px-4 fw-bold">
                            <i class="bi bi-send-fill me-1"></i> สร้างหัวข้อ
                        </button>
                        <a href="{% url 'topic_list' %}" class="btn btn-outline-secondary px-4">ยกเลิก</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- เพิ่มช่องกรอกตัวเลือก -->
<script>
    function addSide() {
        const container = document.getElementById('sides-container');
        const sideCount = container.children.length + 1;
        
        // สร้างกล่องบรรทัดใหม่
        const div = document.createElement('div');
        div.className = 'input-group mb-2';
        
        // สร้างช่องกรอกข้อความ
        const input = document.createElement('input');
        input.type = 'text';
        input.name = 'sides';  // ต้องชื่อ sides เพื่อให้ Python รับค่า getlist('sides') ได้
        input.className = 'form-control';
        input.placeholder = 'ตัวเลือกที่ ' + sideCount;
        input.required = true;
        
        // สร้างปุ่มลบ 
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn btn-outline-danger';
        removeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
        removeBtn.onclick = function() {
            div.remove();
        };
        
        div.appendChild(input);
        div.appendChild(removeBtn);
        container.appendChild(div);
    }
</script>
{% endblock %}
