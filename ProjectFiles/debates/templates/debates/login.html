{% extends 'debates/base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-5">
        <!-- ส่วนหัว -->
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-person-circle me-2" style="color: var(--moss);"></i>เข้าสู่ระบบ</h2>
            <p class="text-muted">ยินดีต้อนรับกลับสู่ Vtopics</p>
        </div>
        
        <!-- ฟอร์มกรอกข้อมูล -->
        <div class="card shadow-sm border-0" style="background-color: #fcfcfc;">
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-orange w-100 mt-3 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
                    </button>
                </form>
            </div>
        </div>
        
        <!-- ลิงก์ไปหน้าสมัครสมาชิก -->
        <div class="text-center mt-4">
            <p class="text-secondary">ยังไม่มีบัญชีใช่ไหม? 
                <a href="{% url 'signup' %}" style="color: var(--moss); font-weight: 500; text-decoration: none;">
                    สมัครสมาชิกที่นี่
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
