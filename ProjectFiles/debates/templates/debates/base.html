
{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการลงคะแนน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Adapted from unslop by Damir Sokolovsky (https://github.com/heydamir/unslop), CC BY 4.0. */
        :root {
            color-scheme: light;
            --paper: #f7f4ee;
            --surface: #fdfbf7;
            --surface-raised: #efe9df;
            --ink: #27251f;
            --ink-soft: #5e594f;
            --ink-muted: #777166;
            --line: rgba(52, 47, 38, .12);
            --moss: #56634a;
            --moss-hover: #45513b;
            --clay: #a77957;
            --ease-soft: cubic-bezier(.22, 1, .36, 1);
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--paper) !important;
            color: var(--ink);
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.65;
        }
        h1, h2, h3, h4, h5, h6 { color: var(--ink); font-weight: 500 !important; letter-spacing: 0; }
        p { color: var(--ink-soft); }
        .text-muted { color: var(--ink-muted) !important; }
        .text-secondary { color: var(--ink-soft) !important; }

        .navbar-custom {
            min-height: 64px;
            background: rgba(247, 244, 238, .96) !important;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0 !important;
        }
        .navbar-custom .container { min-height: 64px; }
        .navbar-custom .navbar-brand {
            color: var(--ink) !important;
            font-weight: 500;
            font-size: 17px;
            letter-spacing: .01em;
        }
        .navbar-custom .text-white { color: var(--ink-soft) !important; }
        .navbar-custom .btn-light { background: transparent; color: var(--ink) !important; border: 1px solid var(--line); }

        body > .container {
            max-width: 1120px;
            margin-top: 32px;
            margin-bottom: 48px;
            padding: 28px !important;
            background: var(--surface) !important;
            border: 1px solid var(--line);
            border-radius: 16px !important;
            box-shadow: 0 1px 2px rgba(39, 37, 31, .04) !important;
            animation: page-enter 420ms var(--ease-soft) both;
        }
        .topic-card {
            min-width: 0;
            padding: 24px;
            word-break: break-word;
            overflow-wrap: anywhere;
            background: var(--surface) !important;
            border: 1px solid var(--line) !important;
            border-left: 1px solid var(--line) !important;
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(39, 37, 31, .035) !important;
            transition: transform 160ms var(--ease-soft), border-color 160ms ease, box-shadow 160ms ease;
        }
        .topic-card:hover {
            transform: translateY(-2px);
            border-color: rgba(86, 99, 74, .28) !important;
            box-shadow: 0 8px 20px rgba(39, 37, 31, .06) !important;
        }
        .topic-card h2 { line-height: 1.35; }
        .topic-card .progress, .progress { background: var(--surface-raised); overflow: hidden; }
        .topic-card .progress-bar, .progress-bar { transition: transform 420ms var(--ease-soft); transform-origin: left center; }
        .card[style*="#fcfcfc"] { background: var(--surface) !important; }
        .border-warning { border-color: rgba(86, 99, 74, .35) !important; }
        .text-warning { color: var(--moss) !important; }
        .btn-warning { color: #fff !important; background: var(--clay); border-color: var(--clay); }
        .btn-warning:hover { color: #fff !important; background: #8f6549; border-color: #8f6549; }
        .btn-danger { color: #74483f; background: #f4e9e5; border-color: #ead8d1; }
        .btn-danger:hover { color: #633d35; background: #ead8d1; border-color: #dec6bd; }

        input[type="text"], input[type="password"], input[type="email"], textarea, select,
        .form-control, .form-select {
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            color: var(--ink);
            background: var(--surface) !important;
            border: 1px solid var(--line) !important;
            border-radius: 9px !important;
            font: inherit;
            box-shadow: none !important;
            transition: border-color 160ms ease, background-color 160ms ease;
        }
        input:focus, textarea:focus, select:focus, .form-control:focus, .form-select:focus {
            border-color: var(--moss) !important;
            outline: 3px solid rgba(86, 99, 74, .13);
        }
        .form-check-input:checked { background-color: var(--moss); border-color: var(--moss); }
        .form-check-input:focus { box-shadow: 0 0 0 3px rgba(86, 99, 74, .16); }

        .btn {
            min-height: 36px;
            border-radius: 8px;
            font-weight: 400;
            transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease, transform 120ms ease;
        }
        .btn:active { transform: scale(.98); }
        .btn-orange, .btn-orange:hover, .btn-orange:focus {
            background-color: var(--moss) !important;
            color: #fff !important;
            border: 1px solid var(--moss) !important;
        }
        .btn-orange:hover { background-color: var(--moss-hover) !important; border-color: var(--moss-hover) !important; }
        .btn-outline-orange { color: var(--moss) !important; border: 1px solid rgba(86, 99, 74, .4) !important; background: transparent; }
        .btn-outline-orange:hover { background: var(--moss) !important; color: white !important; }
        .btn-outline-secondary { color: var(--ink-soft); border-color: var(--line); }
        .btn-outline-secondary:hover { color: var(--ink); background: var(--surface-raised); border-color: var(--line); }
        a { color: var(--moss); text-underline-offset: 3px; }
        a:hover { color: var(--moss-hover); }

        .badge { font-weight: 400; }
        .badge.bg-success, .badge.bg-primary { color: var(--moss) !important; background: rgba(86, 99, 74, .10) !important; }
        .badge.bg-danger { color: #8b5048 !important; background: #f2e5e1 !important; }
        .alert { border-radius: 10px; }
        .alert-success { background: #edf0e8; color: #394532; border-color: #dce3d3; }
        .alert-danger { background: #f4e9e5; color: #74483f; border-color: #ead8d1; }
        .alert-info { background: #edf0ee; color: #40534a; border-color: #dce4df; }
        .alert-warning { background: #f4eee2; color: #66543b; border-color: #e9dfcc; }
        .page-link { color: var(--moss); border-color: var(--line); background: var(--surface); }
        .page-item.active .page-link { background: var(--moss); border-color: var(--moss); }
        .page-item.disabled .page-link { color: var(--ink-muted); background: var(--paper); }
        hr, .border-top { border-color: var(--line) !important; }

        @keyframes page-enter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 576px) {
            body > .container { margin-top: 16px; padding: 20px !important; border-radius: 12px !important; }
            .topic-card { padding: 20px; }
            .topic-card h2 { font-size: 1.25rem !important; }
            h1 { font-size: 1.75rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand mb-0" href="{% url 'topic_list' %}">Voted topics</a>

            <div class="d-flex align-items-center ms-auto text-white">
                {% if user.is_authenticated %}
                <a href="{% url 'user_profile' %}" class="text-white text-decoration-none me-3">{{ user.username }}</a>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light btn-sm text-dark">ออกจากระบบ</button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="text-white text-decoration-none me-3">เข้าสู่ระบบ</a>
                <a href="{% url 'signup' %}" class="btn btn-light btn-sm text-dark">สมัครสมาชิก</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container bg-white p-4 rounded shadow-sm">
        {% if messages %}
        <div class="mb-3" aria-live="polite">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="ปิด"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
